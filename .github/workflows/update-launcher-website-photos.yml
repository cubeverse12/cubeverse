name: Update MINEVORA website photos to launcher 18.3.16
on:
  push:
    branches: [main]
    paths:
      - 'tools/build_launcher_18_3_16_website_gallery.py'
      - '.github/workflows/update-launcher-website-photos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install image processing library
        run: python -m pip install "Pillow>=10,<13"
      - name: Generate updated launcher artwork for website
        run: python tools/build_launcher_18_3_16_website_gallery.py
      - name: Commit actual new WebP assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/launcher-18-3-16/
          if ! git diff --cached --quiet; then
            git commit -m "Publish launcher 18.3.16 website photos and UI preview"
            git push
          fi
