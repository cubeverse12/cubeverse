name: Build MINEVORA HD website images

on:
  push:
    branches: [main]
    paths:
      - 'tools/build_site_hd_gallery.py'
      - '.github/workflows/build-site-hd-gallery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  graphics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install 'Pillow>=11,<13'
      - name: Create high-resolution 16:9 WebP gallery
        run: python tools/build_site_hd_gallery.py
      - name: Verify HD gallery sizes and all files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root=Path("assets/site-hd")
          manifest=json.loads((root/"manifest.json").read_text(encoding="utf-8"))
          assert len(manifest["images"]) == 16, manifest.keys()
          for source, record in manifest["images"].items():
              file=Path("assets")/record["file"]
              assert file.exists(), (source, file)
              with Image.open(file) as image:
                  assert image.size == (record["width"],record["height"]), (file,image.size)
                  image.verify()
          print("Verified all 16 HD images.")
          PY
      - name: Commit HD images and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/site-hd/
          if git diff --cached --quiet; then
            echo "HD files already current."
          else
            git commit -m "MINEVORA: publish 1600x900 HD website image gallery"
            git push origin HEAD:main
          fi
