name: MINEVORA Public Website Deployment Check
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'v4/**'
      - '.github/workflows/minevora-public-deploy-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-live-website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployed page markers and actual artwork hashes
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, time, urllib.request
          from pathlib import Path
          meta = json.loads(Path('v4/site-version.json').read_text(encoding='utf-8'))
          token = meta['site_build']
          html = {
              'index.html': token,
              'v4/index.html': token,
              'v4/pobierz/index.html': token,
              'v4/poradnik/index.html': token,
              'v4/host/index.html': token,
              'v4/sklep/index.html': token,
              'v4/site-version.json': token,
          }
          assets = [
              'v4/' + meta['banner_asset'],
              'v4/assets/minevora-app-icon-launcher-1-56-12.png',
              'v4/launcher-match-rc11.css',
              'v4/minevora-i18n.js',
              'v4/sklep/shop.css',
              'v4/sklep/shop.js',
              'v4/sklep/catalog.json',
          ]
          assets.extend('v4/sklep/' + item['download'] for item in json.loads(Path('v4/sklep/catalog.json').read_text())['items'])
          checks = {name: ('marker', expected) for name, expected in html.items()}
          checks.update({name: ('sha256', hashlib.sha256(Path(name).read_bytes()).hexdigest()) for name in assets})
          pending = set(checks)
          for attempt in range(1, 13):
              for name in sorted(pending):
                  mode, expected = checks[name]
                  path = name[:-10] if name.endswith('index.html') else name
                  url = 'https://minevora.pl/' + path + '?build-check=' + token + '-' + str(attempt)
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent':'MINEVORA-Public-Check', 'Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req, timeout=12) as response:
                          raw = response.read()
                          ok = response.status == 200 and (hashlib.sha256(raw).hexdigest() == expected if mode == 'sha256' else expected in raw.decode('utf-8', 'replace'))
                          print(name, response.status, 'match', ok, flush=True)
                          if ok:
                              pending.remove(name)
                  except Exception as exc:
                      print(name, type(exc).__name__, str(exc)[:160], flush=True)
              if not pending:
                  break
              if attempt < 12:
                  time.sleep(10)
          if pending:
              raise SystemExit('Public deployment mismatch: ' + ', '.join(sorted(pending)))
          print('Verified public build:', token)
          PY
